[project]
name = "orca-vision-helper"
version = "0.1.0"
description = "Fallback CLI for vision-limited agents to analyze local images with a configured vision provider."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["orca", "vision", "screenshot", "llm", "ui-debugging", "mcp"]

dependencies = [
    "httpx>=0.27",
    "pillow>=10.0",
    "pydantic>=2.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
orca-vision-helper = "orca_vision_helper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orca_vision_helper"]

[tool.ruff]
line-length = 100
target-version = "py311"
